# Builds the image and pushes it to Docker Hub on every push to master,
# overwriting the `latest` tag. Each push also creates an immutable tag with the
# short commit hash.
#
# Secrets (repository settings -> Secrets and variables -> Actions -> Secrets):
#   DOCKERHUB_USERNAME  Docker Hub account to push as
#   DOCKERHUB_TOKEN     that account's access token, with `Read & Write` scope
#
# Variables (repository settings -> Secrets and variables -> Actions -> Variables),
# both optional:
#   IMAGE_NAME  repository on Docker Hub, defaults to `tmmrtn/calibre-webdav`
#   PLATFORMS   build platforms, defaults to `linux/amd64`

name: publish-docker-image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve tags
        id: image
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          name="${IMAGE_NAME:-tmmrtn/calibre-webdav}"
          echo "reference=$name" >> "$GITHUB_OUTPUT"
          echo "revision=$(printf '%s' "$GITHUB_SHA" | cut --characters=1-12)" >> "$GITHUB_OUTPUT"
          echo "created=$(date --utc --iso-8601=seconds)" >> "$GITHUB_OUTPUT"

      # Only needed when PLATFORMS names an architecture the runner is not.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ vars.PLATFORMS || 'linux/amd64' }}
          tags: |
            ${{ steps.image.outputs.reference }}:latest
            ${{ steps.image.outputs.reference }}:${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
